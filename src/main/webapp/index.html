<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Space Explorer</title>
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>
  <div id="appContainer">
    <div class="header">
      <div class="header-left">
        <h1>🚀 Deep Space Explorer</h1>
      </div>
      
      <div class="header-center">
        <input type="text" id="searchBar" placeholder="Search planets...">
      </div>
      
      <div class="header-right">
        <div class="control-group">
          <label>Speed:</label>
          <input type="range" id="speedSlider" min="1" max="20" value="5">
          <span id="speedText">5</span>
        </div>
        <div class="control-group">
          <label>Stars:</label>
          <input type="range" id="starsSlider" min="50" max="500" value="200">
          <span id="starsText">200</span>
        </div>
        <button id="themeToggle" class="btn-icon">☀️</button>
        <input type="color" id="themeColor" value="#00d4ff">
        <button id="screenshotBtn" class="btn-icon">📸</button>
        <button id="fullscreenBtn" class="btn-icon">⛶</button>
      </div>
    </div>
    
    <div class="main-content">
      <canvas id="spaceCanvas"></canvas>
      
      <div class="info-panels">
        <div class="info-panel">
          <h3>📚 Space Fact</h3>
          <div class="fact-item" id="currentFact">Click for new fact...</div>
        </div>
        
        <div class="planet-info-panel">
          <h3 id="planetName">🌍 Hover a planet</h3>
          <div id="planetDiameter"></div>
          <div id="planetFact">Learn amazing facts!</div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/app.js"></script>
</body>
</html>
