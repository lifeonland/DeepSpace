name: DeepSpace Enterprise CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Database Migration Validation (Isolated)
  db-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: deepspace_db
          POSTGRES_USER: deepspace_user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Run Flyway Migrations
        run: |
          cd deepspace-api
          mvn flyway:migrate -Dflyway.url=jdbc:postgresql://localhost:5432/deepspace_db -Dflyway.user=deepspace_user -Dflyway.password=password

  # 2. Parallel Quality Gates
  quality-gates:
    needs: db-migration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [lint, sca, sast]
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.job }}
        run: |
          if [ "${{ matrix.job }}" == "lint" ]; then
            cd deepspace-ui && npm install && npm run lint
          elif [ "${{ matrix.job }}" == "sca" ]; then
            npm audit --prefix deepspace-ui
          elif [ "${{ matrix.job }}" == "sast" ]; then
            echo "Running SAST analysis..."
          fi

  # 3. Application Build
  build:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API & UI
        run: |
          cd deepspace-api && mvn clean package -DskipTests
          cd ../deepspace-ui && npm install && npm run build

  # 4. Parallel Analysis & Containerization
  analysis-and-docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ui]
    steps:
      - uses: actions/checkout@v4
      - name: Codacy Analysis
        if: matrix.service == 'api'
        uses: codacy/codacy-analysis-cli-action@master
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          
      - name: Docker Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./deepspace-${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/deepspace-${{ matrix.service }}:latest
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
EOF
